# Image backend ke GHCR.
#
# Dipakai kalau host (Render/Railway/Fly) lebih suka menarik image siap pakai
# daripada membangun sendiri, atau untuk menyimpan image yang sudah terbukti
# lolos uji. Dijalankan manual atau saat tag `v*` dibuat — bukan setiap push,
# supaya menit CI tidak habis untuk build image 1,9 GB.

name: Image backend

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
