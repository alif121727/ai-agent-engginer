# Deploy studio statis ke GitHub Pages.
#
# Kenapa ada: situs Netlify `agent-studio-ai` memakai kredit yang sudah habis,
# sehingga build dari Git di-skip dan push tidak memperbarui apa pun. GitHub
# Pages tidak butuh kredit dan repo ini publik, jadi ini jalur deploy yang
# selalu bisa dipakai.
name: Deploy ke GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages-ready: ${{ steps.pages.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # --include=dev: `npm ci` menghormati NODE_ENV, dan build butuh esbuild.
      - run: npm install --include=dev --no-audit --no-fund
      - run: npm run build:studio
      # enablement: true membuat Pages aktif sendiri lewat API. Token GitHub App
      # yang tersedia di sini tidak punya izin itu, jadi kegagalannya ditoleransi:
      # CI tetap hijau, dan workflow ini langsung bekerja begitu Pages diaktifkan
      # sekali secara manual (Settings -> Pages -> Source: GitHub Actions).
      - id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true
      - if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: netlify-site

  deploy:
    needs: build
    if: needs.build.outputs.pages-ready == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
