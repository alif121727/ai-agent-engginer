# Deploy studio statis ke GitHub Pages.
#
# Kenapa ada: situs Netlify `agent-studio-ai` kehabisan kredit, sehingga build
# dari Git di-skip dan push tidak memperbarui apa pun. GitHub Pages tidak butuh
# kredit dan repo ini publik, jadi ini jalur deploy yang selalu bisa dipakai.
#
# Situs Pages di repo ini berjalan dalam mode "legacy": sumbernya branch
# `gh-pages`, bukan artifact Actions. Jadi workflow ini mem-build lalu
# mem-push hasilnya ke branch itu; Pages membangun ulang sendiri setiap push.
# actions/deploy-pages akan gagal di sini karena build_type bukan "workflow".
name: Deploy ke GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # --include=dev: npm menghormati NODE_ENV, dan build butuh esbuild.
      - run: npm install --include=dev --no-audit --no-fund
      # STUDIO_URL (variabel repo) membekukan alamat backend ke bundel Pages.
      # Tanpa itu dipakai default di studio/src/links.ts.
      - run: npm run build:studio
        env:
          STUDIO_URL: ${{ vars.STUDIO_URL }}

      - name: Push hasil build ke gh-pages
        run: |
          cd netlify-site
          # .nojekyll: Jekyll membuang file/folder berawalan garis bawah.
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build ${GITHUB_SHA::7} dari main"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
