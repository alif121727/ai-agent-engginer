# Fly.io: satu mesin, satu volume untuk SQLite + hasil render.
# Ganti `app` kalau namanya sudah dipakai (nama app unik global), lalu:
#   fly apps create <app>
#   fly volumes create studio_data --size 10 --region sin
#   fly secrets set SESSION_SECRET=$(openssl rand -hex 32)
#   fly secrets set APP_URL=https://<app>.fly.dev
#   fly deploy --ha=false
app = "ai-agent-engginer"
primary_region = "sin"

# Deploy menunggu ffmpeg yang sedang jalan selesai dulu, bukan memutusnya di
# detik pertama. Kunci root harus berada sebelum tabel pertama.
kill_signal = "SIGTERM"
kill_timeout = 60

[build]
  dockerfile = "Dockerfile"

# ffmpeg 1080p + Piper butuh lebih dari 256 MB (default `fly launch`).
# 4 vCPU dipilih setelah mengukur: dengan 2 vCPU, encode 30 dtk menyita CPU
# sampai /api/health butuh 8 dtk, health check (timeout 5 dtk) gagal terus, dan
# Fly menghentikan mesin di tengah render — job "macet" di 87%.
[[vm]]
  size = "shared-cpu-4x"
  memory = "4gb"

[env]
  PORT = "8080"
  NODE_ENV = "production"
  # Worker berjalan di proses API: host satu-mesin tidak punya service worker
  # terpisah yang berbagi volume.
  WORKER_IN_PROCESS = "1"
  DB_KIND = "sqlite"
  # Semua data pengguna (akun + jobs/) diarahkan ke volume.
  STUDIO_DATA_DIR = "/data"
  DB_PATH = "/data/data/studio.db"
  CORS_ORIGINS = "https://alif121727.github.io,https://agent-studio-ai.netlify.app"

[[mounts]]
  source = "studio_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Mesin harus tetap hidup: worker render memakai CPU bermenit-menit, dan Fly
  # mematikan mesin yang dianggap idle. `off` (bukan "stop") mematikan autostop
  # sepenuhnya; dengan "stop" mesin berhenti 5 menit setelah trafik terakhir
  # walau min_machines_running = 1, dan render terputus di tengah jalan.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    # 10 dtk, bukan 5: saat ffmpeg memakai seluruh vCPU, API bisa butuh
    # beberapa detik untuk menjawab. Timeout 5 dtk membuat check gagal terus
    # selama render dan Fly menghentikan mesin (requested_stop=true).
    timeout = "10s"
