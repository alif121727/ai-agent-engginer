# fly.toml app configuration file generated for ai-agent-engginer on 2026-11-27T13:51:38Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'ai-agent-engginer'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  CORS_ORIGINS = 'https://alif121727.github.io,https://agent-studio-ai.netlify.app'
  DB_KIND = 'sqlite'
  DB_PATH = '/data/data/studio.db'
  NODE_ENV = 'production'
  PORT = '8080'
  STUDIO_DATA_DIR = '/data'
  WORKER_IN_PROCESS = '1'

[[mounts]]
  source = 'studio_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
