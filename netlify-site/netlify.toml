[build]
  publish = "."

[[headers]]
  for = "/video/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Accept-Ranges = "bytes"

[[headers]]
  for = "/thumb/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# studio.js / studio.css TIDAK ber-hash, jadi jangan di-cache lama:
# kalau di-cache immutable, deploy berikutnya tidak terlihat oleh pengguna.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
