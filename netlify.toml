# Konfigurasi Netlify untuk repo ini.
# Situs ini terhubung ke GitHub, jadi SETIAP push memicu build. Sebelum file ini
# ada, Netlify memakai publish dir = root repo yang tidak punya index.html,
# sehingga setiap push menimpa deploy bagus dengan 404.
[build]
  command = "npm install --include=dev --no-audit --no-fund && npm run build:studio"
  publish = "netlify-site"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/video/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Accept-Ranges = "bytes"

[[headers]]
  for = "/thumb/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# studio.js / studio.css tidak ber-hash di nama file, jadi jangan di-cache lama:
# kalau di-cache immutable, deploy berikutnya tidak terlihat oleh pengguna.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Service worker dan manifest ikut berubah tiap deploy, jadi jangan di-cache
# lama: kalau tidak, pengguna bisa memakai SW lama yang menyajikan app shell lama.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/json"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# 404 statis: tanpa ini Netlify menampilkan halaman bawaannya yang tidak
# bermerek. GitHub Pages memakai 404.html yang sama secara otomatis.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
