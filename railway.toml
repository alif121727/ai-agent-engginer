# Railway: build dari Dockerfile repo ini.
# Setelah service dibuat, tambahkan Volume dengan mount path /data, lalu isi
# variabel di dashboard (lihat docs/DEPLOY-BACKEND.md).
[build]
  builder = "DOCKERFILE"
  dockerfilePath = "Dockerfile"

[deploy]
  healthcheckPath = "/api/health"
  healthcheckTimeout = 180
  restartPolicyType = "ON_FAILURE"
  restartPolicyMaxRetries = 10
