# Blueprint Render: satu service, satu disk. Worker berjalan di proses API
# (WORKER_IN_PROCESS=1) karena Render tidak bisa menjalankan service worker
# terpisah yang berbagi disk yang sama.
# plan wajib paket berbayar: Render hanya mengizinkan persistent disk pada
# service berbayar, dan tanpa disk akun serta video hilang setiap deploy.
# 1c-2g = 1 CPU / 2 GB, batas bawah yang aman untuk ffmpeg 1080p.
# Naikkan ke 2c-4g kalau render terasa lambat.
services:
  - type: web
    name: studio-ai-otomotif
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: 1c-2g
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: WORKER_IN_PROCESS
        value: "1"
      # Tanpa ini `media-sign.ts` melempar error saat membuat URL media publik,
      # jadi video hasil render tidak bisa diputar/diunduh dari UI.
      - key: SESSION_SECRET
        generateValue: true
      # Cookie sesi hanya ditandai Secure kalau APP_URL https. Isi dengan URL
      # service setelah Render selesai membuatnya.
      - key: APP_URL
        sync: false
      # UI statis (GitHub Pages + Netlify) harus diizinkan memanggil API ini.
      - key: CORS_ORIGINS
        value: https://alif121727.github.io,https://agent-studio-ai.netlify.app
      # SQLite dan hasil render harus berada di disk, bukan filesystem container
      # yang hilang setiap deploy. STUDIO_DATA_DIR mengarahkan jobs/ dan data/
      # ke disk; DB_PATH ditulis eksplisit supaya tidak bergantung pada default.
      - key: STUDIO_DATA_DIR
        value: /var/data
      - key: DB_KIND
        value: sqlite
      - key: DB_PATH
        value: /var/data/db/studio.db
    disk:
      name: studio-data
      mountPath: /var/data
      sizeGB: 10
