<!doctype html>
<html lang="id">

    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
        background: radial-gradient(circle at 50% 0%, #12203a 0%, #07080f 60%);
        color: #e8ecf5; font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .box { max-width: 520px; text-align: center; }
      .code {
        font: 800 4.5rem/1 "JetBrains Mono", ui-monospace, monospace;
        color: #5ce1ff; letter-spacing: -2px; margin: 0 0 8px;
      }
      h1 { font-size: 1.35rem; margin: 0 0 10px; }
      p { color: #9aa6bd; line-height: 1.65; margin: 0 0 22px; font-size: 0.95rem; }
      .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
      a {
        display: inline-flex; align-items: center; gap: 8px; text-decoration: none;
        padding: 10px 18px; border-radius: 10px; font-weight: 600; font-size: 0.9rem;
        border: 1px solid #2a3348; background: #151a26; color: #e8ecf5;
      }
      a.primary { background: #5ce1ff; border-color: #5ce1ff; color: #05121a; }
      a:hover { filter: brightness(1.1); }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="code">404</div>
      <h1>Halaman ini tidak ada</h1>
      <p>
        Alamat yang Anda buka tidak ditemukan. Mungkin tautannya salah ketik, atau
        halamannya sudah berpindah. Semua yang bisa dibuka ada di dalam studio.
      </p>
      <div class="row">
        <a class="primary" href="./">Buka studio</a>
        <a href="./#/perpustakaan">Lihat perpustakaan</a>
        <a href="./#/garasi">Lihat garasi</a>
      </div>
    </div>

</html>
