<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent Studio AI — Studio Video Otomotif</title>
    <meta name="description" content="Studio produksi video otomotif berbasis data: brief, storyboard, sembilan tahap pipeline, dan QA nyata." />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#ff6b35" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="ikon/ikon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/studio.css" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ff6b35'/%3E%3Ctext x='16' y='22' font-size='15' font-weight='800' font-family='sans-serif' fill='%231a0d05' text-anchor='middle'%3EAS%3C/text%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>Studio ini memerlukan JavaScript untuk berjalan.</noscript>
    <script src="assets/studio.js" defer></script>
    <script>
      // Service worker hanya untuk app shell; video tetap diambil dari jaringan.
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('sw.js').catch(function () {});
        });
      }
    </script>
  </body>
</html>
